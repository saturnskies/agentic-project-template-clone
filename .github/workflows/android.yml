name: Android APK

# Builds the signed APK. To publish a GitHub Release either push a tag like v0.3.0, or run this
# workflow by hand from main with `release_tag` set (it creates the tag and the release itself).
# A manual run without `release_tag` only builds the APK as a downloadable artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release with this tag, e.g. v0.3.0 (main only). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write # create the release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide the release tag
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          TAG=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then TAG="$GITHUB_REF_NAME"; else TAG="$INPUT_TAG"; fi
          if [ -n "$TAG" ]; then
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Release tag must look like v0.3.0, got '$TAG'."; exit 1; }
            if [ "$GITHUB_REF_TYPE" != tag ] && [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Releases can only be published from main (this run is on $GITHUB_REF_NAME)."; exit 1
            fi
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # GitHub's Ubuntu runners already include the Android SDK; Gradle fetches the platform it needs once licenses are accepted.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm ci

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SWAPSMITH_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SWAPSMITH_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing secret SWAPSMITH_KEYSTORE_BASE64. See docs/android-build.md (Publishing from GitHub)."
            exit 1
          fi
          KS="$RUNNER_TEMP/swapsmith.keystore"
          # Pasted secrets often pick up line breaks or spaces; they are not part of the value.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$KS" \
            || { echo "::error::SWAPSMITH_KEYSTORE_BASE64 is not valid base64. Recreate it with: base64 -w0 swapsmith-signing.keystore (paste the single line of output)."; exit 1; }
          keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1 \
            || { echo "::error::The decoded file is not a keystore, or SWAPSMITH_KEYSTORE_PASSWORD is wrong."; exit 1; }
          echo "SWAPSMITH_KEYSTORE=$KS" >> "$GITHUB_ENV"

      - name: Build the signed APK
        env:
          SWAPSMITH_KEYSTORE_PASSWORD: ${{ secrets.SWAPSMITH_KEYSTORE_PASSWORD }}
          SWAPSMITH_KEY_ALIAS: ${{ secrets.SWAPSMITH_KEY_ALIAS }}
          SWAPSMITH_KEY_PASSWORD: ${{ secrets.SWAPSMITH_KEY_PASSWORD }}
        run: |
          # versionCode must only ever go up. The run number does, and +100 keeps it above the hand-built 0.2.0 (code 2).
          export SWAPSMITH_VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))
          if [ -n "$RELEASE_TAG" ]; then export SWAPSMITH_VERSION_NAME="${RELEASE_TAG#v}"; else export SWAPSMITH_VERSION_NAME="0.0.0-run$GITHUB_RUN_NUMBER"; fi
          echo "VERSION_NAME=$SWAPSMITH_VERSION_NAME" >> "$GITHUB_ENV"
          npm run apk
          cp android/app/build/outputs/apk/release/app-release.apk "swapsmith-$SWAPSMITH_VERSION_NAME.apk"

      - name: Check the APK is signed with the app's key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs "swapsmith-$VERSION_NAME.apk" | tee certs.txt
          grep -q 'c7edba6c3fb9f53c595977bb6a985bcf3d3b1e2769c605c69dfe6e21dae3fc3c' certs.txt \
            || { echo "::error::APK is not signed with the original Swapsmith key; phones could not update to it."; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: swapsmith-apk
          path: swapsmith-*.apk

      - name: Publish the release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="swapsmith-$VERSION_NAME.apk"
          # The release may already exist (created on github.com, which makes the tag too). Otherwise create it,
          # which also creates the tag at this commit.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$FILE" --clobber
          else
            gh release create "$RELEASE_TAG" "$FILE" --target "$GITHUB_SHA" --title "Swapsmith $VERSION_NAME" --generate-notes
          fi
